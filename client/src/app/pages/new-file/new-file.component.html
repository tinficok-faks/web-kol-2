<div class="mb-4">
    <label class="form-label fw-medium">Choose a file</label>
    <div class="d-flex gap-2 align-items-center">
        <input class="form-control" type="file" (change)="onFileSelected($event)" id="fileInput" />
        <button class="btn btn-primary" type="button" (click)="uploadFile()" [disabled]="!selectedFile || isUploading">
            {{ isUploading ? 'Uploading...' : 'Upload' }}
        </button>
    </div>
</div>
