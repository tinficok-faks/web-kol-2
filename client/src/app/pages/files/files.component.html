<div class="d-flex align-items-center justify-content-between mb-3">
    <h3 class="mb-0">Datoteke</h3>
    <a class="btn btn-primary" routerLink="/new-file">
        <i class="bi bi-plus-circle me-2"></i>
        Nova datoteka
    </a>
</div>

<div *ngIf="isLoading" class="alert alert-light border">Učitavanje...</div>

<div *ngIf="!isLoading && files.length === 0" class="alert alert-warning">
    Nema uploadanih datoteka.
</div>

<div *ngIf="!isLoading && files.length > 0" class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Naziv</th>
                    <th class="text-end">Veličina</th>
                    <th class="text-end" style="width: 220px;">Akcije</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let f of files">
                    <td>
                        <div class="fw-medium">{{ f.originalName }}</div>
                        <div class="text-muted small">{{ f.mimetype }}</div>
                    </td>
                    <td class="text-end">{{ f.size }} B</td>
                    <td class="text-end">
                        <button class="btn btn-outline-primary btn-sm me-2" (click)="download(f)">
                            <i class="bi bi-download me-1"></i> Preuzmi
                        </button>
                        <button class="btn btn-outline-danger btn-sm" (click)="delete(f)">
                            <i class="bi bi-trash me-1"></i> Obriši
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
