<div *ngIf="isLoading" class="alert alert-light border">Loading...</div>

<div *ngIf="!isLoading && files.length === 0" class="alert alert-warning">
    No files uploaded yet.
</div>

<div *ngIf="!isLoading && files.length > 0" class="row g-4">
    <div *ngFor="let f of files" class="col-12 col-md-6 col-lg-4">
        <div class="card border-0 shadow-sm h-100 d-flex flex-column position-relative">
            <div class="card-body d-flex flex-column align-items-center py-4 flex-grow-1">
                <div class="fw-medium mb-2">{{ f.originalName }}</div>
                <div class="text-muted small mb-3">{{ formatFileSize(f.size) }}</div>
                <div class="display-3 my-3">{{ getFileIcon(f.originalName) }}</div>
            </div>
            <div class="position-absolute bottom-0 end-0 d-flex gap-2 p-3">
                <button class="btn btn-sm p-0" (click)="download(f)" title="Download"
                    style="width: 36px; height: 36px; border-radius: 50%; background-color: #e9ecef; border: none; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-download text-primary"></i>
                </button>
                <button class="btn btn-sm p-0" (click)="delete(f)" title="Delete"
                    style="width: 36px; height: 36px; border-radius: 50%; background-color: #e9ecef; border: none; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-trash text-danger"></i>
                </button>
            </div>
        </div>
    </div>
</div>
